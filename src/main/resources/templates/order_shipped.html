<!DOCTYPE html>
<html>
<head>
    <title>Your Order is Shipped</title>
    <style>
    .container { max-width:600px; margin:20px auto; background:#fff; border-radius:8px; padding:32px 24px; font-family:'Segoe UI', Arial, sans-serif; box-shadow:0 3px 18px rgba(60,60,90,0.12); color:#222; }
    .header { text-align:center; margin-bottom:24px; }
    .footer { font-size:13px; color:#888; text-align:center; margin-top:32px; }
    .track-btn { background:#0275d8; color:#fff; padding:12px 32px; border-radius:6px; text-decoration:none; display:inline-block; font-weight:bold; margin-top:24px; }
  </style>
</head>
<body style="background:#f6f8fb">
<div class="container">
    <div class="header">
        <h1>Your Order #{orderId} is on the Way!</h1>
    </div>
    <p>Hi <strong>{userName}</strong>,</p>
    <p>
        Great news! Your order <b>#{orderId}</b> has been shipped.<br>
        Track your shipment for live updates.
    </p>
    <div style="text-align:center;">
        <a href="{trackingUrl}" class="track-btn">Track Order</a>
    </div>
    <div class="footer">
        <p>This message was sent from <a href="mailto:{mailFrom}">{mailFrom}</a>.</p>
        <p>© 2025 Ecommm</p>
    </div>
</div>
</body>
</html>
